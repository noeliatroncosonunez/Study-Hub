<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="crear cuenta.css">
    <title>Crear Cuenta</title>
</head>
<body>
    
div class="container">
    <a href="index.html" class="back-link">&larr; Volver al inicio</a>

    <div class="header">
        <h2>Crear Cuenta</h2>
        <p>Regístrate para acceder a la plataforma</p>
    </div>

    <form id="registroForm" novalidate>
        <div class="input-box">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="input-box">
            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" placeholder="tu@correo.com" required>
        </div>

        <div class="input-box">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
                <button type="button" class="toggle-password" onclick="togglePass('password', this)">Ver</button>
            </div>
        </div>

        <div class="input-box">
            <label for="confirmar">Confirmar Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="confirmar" required placeholder="Repite tu contraseña">
                <button type="button" class="toggle-password" onclick="togglePass('confirmar', this)">Ver</button>
            </div>
        </div>

        <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <div id="mensaje"></div>

    <p class="login-link">
        ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>
    </p>
</div>

</body>
</html>
