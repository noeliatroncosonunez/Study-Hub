    <header>
        <section class="logo">
            <h1>📚 Study Hub</h1>
        </section>
        <nav>
            <a href="study hub.html">Volver al Inicio</a>
        </nav>
    </header>

    <main>
        <article class="register-container">
            <h2>Crear Cuenta</h2>
        
            <p id="error-message" class="alert-error" style="display: none;"></p>
            
            <form id="registerForm">
                <section class="input-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Tu usuario" required autocomplete="username">
                </section>

                <section class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required autocomplete="email">
                </section>

                <section class="input-group">
                    <label for="curso">Curso / Grado</label>
                    <select name="curso" required>
                        <option value="disabled selected">Selecciona tu curso</option>
                        <option value="1° Básico">1° Básico / 5° Básico</option>
                        <option value="2° Básico">2° Básico / 6° Básico</option> 
                        <option value="3° Básico">3° Básico / 7° Básico</option>
                        <option value="4° Básico">4° Básico / 8° Básico</option>
                        <option value="1° Medio">1° Medio</option>
                        <option value="2° Medio">2° Medio</option>
                        <option value="3° Medio">3° Medio</option>
                        <option value="4° Medio">4° Medio</option>
                        <option value="Universidad">Universidad / Superior</option>
                    </select>
                </section>

                <section class="input-group">
                    <label for="password">Contraseña</label>
                    <span class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" id="togglePassword" class="btn-toggle">👁️</button>
                    </span>
                </section>

                <section class="input-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <span class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
                    </span>
                </section>

                <button type="submit" class="btn-register">Registrarse</button>
            </form>

            <footer class="login-footer">
                <p>¿Ya tienes una cuenta? <a href="">Inicia sesión aquí</a></p>
            </footer>
        </article>
    </main>

    <script src="crear cuenta.js"></script>
  <main>
</body>
</html>
