<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="crear cuenta.css">
    <title>Crear cuenta</title>
</head>
<body>
    <main class="card">

        <span class="badge">Registro</span>

        <h2>Crea tu cuenta</h2>
        <p>Crea tu cuenta, empieza a explorar nuestras secciones de la página y descubre
        más sobre nuestra página Web.</p>

        <form id="registroForm">
            <label for="nombre">Nombre apellido</label>
            <input type="text" id="nombre" placeholder="" required">

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="" required>

            <label for="contreseña">Contraseña</label>
            <input type="password" id="password" placeholder="" required>
        <div>
            <label for="confirmar">Confirmar Contraseña</label>
            <input type="password" id="confirmar" placeholder="" required>
            <button type="button" class="toggle.password" onclick="toggle('confirmar', this)">
                <i data-lucide="eye"></i>
            </button>
        </div>
        
            <label class="checkbox-container">
                <input type="checkbox" id="terminos" required>
                <span class="checkmark"></span>
                <span>Acepto los <a href="#">Término</a> y la <a href="#">Privacidad</a></span>
            </label>

            <button type="submit" class="btn-submit">
                <span>Crear mi cuenta</span>
                <i data-lucide="sparkles></i>
            </button>
        </form>

        <output id="mensaje" class="mensaje"></output>

        <p>¿Ya tienes una una cuenta?<a href=""></a></p>
    </main>

    <footer>© 2026 Study Hub - Plataforma de Aprendizaje Autónomo</footer>

    <script src="crear cuenta.js"></script>
</body>
</html>     |
