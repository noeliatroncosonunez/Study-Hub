<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="study_hub.css">
    <title>Study Hub | IA StudyBot</title>
</head>
<body>

<header class="header-bot">
    <h1>🤖 IA StudyBot</h1>
    <p>Tu asistente virtual de aprendizaje disponible las 24 horas.</p>
</header>

<main class="chat-container">
    <article class="chat-box" id="chatBox">

        <article class="mensaje bot">
            👋 ¡Hola! Soy StudyBot.
            Puedo ayudarte con Matemáticas, Historia, Ciencias, Programación y técnicas de estudio.
        </article>
    </article>

    <article class="sugerencias">

        <button onclick="preguntaRapida('¿Qué es HTML?')">💻 HTML</button>

        <button onclick="preguntaRapida('Ayúdame con matemáticas')">📐 Matemáticas</button>

        <button onclick="preguntaRapida('¿Qué es la fotosíntesis?')">🌱 Biología</button>

        <button onclick="preguntaRapida('Consejos para estudiar')">📚 Estudio</button>
    </article>

    <article class="input-container">

        <input type="text" id="pregunta"
        placeholder="Escribe tu pregunta..."
        >

        <button onclick="responderIA()">
            Enviar
        </button>
    </article>

    <article class="acciones-chat">
        <button onclick="limpiarChat()">
            🗑️ Limpiar Chat
        </button>
    </article>
</main>

    <a href="study_hub.html" class="btn-volver">&larr; Volver al Inicio</a>

    <script src="study_hub.js"></script>

</body>
</html>
