<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Study Hub</title>
</head>
<body>
    <main>
        <div class="login-container">
            <h2>Iniciar Sesión</h2>
        
            <!-- Mensaje de error dinámico -->
            <div id="error-message" class="alert-error" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuario o Correo</label>
                    <input type="text" id="username" name="username" placeholder="Tu usuario o email" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="btn-toggle">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>

            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <script src="iniciar sesion.js"></script>
</body>
</html>
