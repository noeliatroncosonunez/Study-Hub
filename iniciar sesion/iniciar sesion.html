<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="iniciar sesion.css">
    <title>Inicio de Sesión - Study Hub</title>
</head>
<body>

    <header>
        <section class="logo">
            <h1>📚 Study Hub</h1>
        </section>
        <nav>
            <a href="../study Hub.html">Volver al Inicio</a>
        </nav>
    </header>

    <main>
        <article class="login-container">
            <h2>Iniciar Sesión</h2>
        
            <p id="error-message" class="alert-error" style="display: none;"></p>
            
            <form id="loginForm">
                <section class="input-group">
                    <label for="username">Usuario o Correo</label>
                    <input type="text" id="username" name="username" placeholder="Tu usuario o email" required autocomplete="username">
                </section>

                <section class="input-group">
                    <label for="password">Contraseña</label>
                    <span class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="btn-toggle">👁️</button>
                    </span>
                </section>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>

            <footer class="login-footer">
                <p>¿No tienes una cuenta? <a href="../Crear Cuenta/crear cuenta.html">Regístrate aquí</a></p>
            </footer>
        </article>
    </main>

    <script src="iniciar sesion.js"></script>
</body>
</html>
